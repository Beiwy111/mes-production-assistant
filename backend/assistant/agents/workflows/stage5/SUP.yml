          \ and cleaned.endswith('```'):\n        cleaned = re.sub(r'^```(?:json)?\\\
          s*', '', cleaned, flags=re.I)[:-3].strip()\n    def unique(pairs):\n   \
          \     result={}\n        for key,value in pairs:\n            if key in\
          \ result: raise ValueError('Duplicate plan field')\n            result[key]=value\n\
          \        return result\n    plan=json.loads(cleaned,object_pairs_hook=unique)\n\
          \    fields={'action','intents','orderPk','orderNo','keyword','period','question'}\n\
          \    if not isinstance(plan,dict) or set(plan)!=fields: raise ValueError('Unexpected\
          \ plan fields')\n    if plan['action'] not in {'QUERY','CLARIFY','UNSUPPORTED'}:\
          \ raise ValueError('Invalid plan action')\n    if not isinstance(plan['intents'],list)\
          \ or len(plan['intents'])>len(INTENTS) or any(i not in INTENTS for i in\
