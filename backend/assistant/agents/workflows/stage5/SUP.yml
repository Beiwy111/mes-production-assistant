          \         if type(value)!=int or not 1<=value<=2147483647: raise ValueError('Invalid\
          \ quantity')\n        elif not isinstance(value,str) or not value.strip()\
          \ or len(value)>INTAKE_LIMITS[key] or any(ord(c)<32 or ord(c)==127 for c\
          \ in value):\n            raise ValueError('Invalid text field')\n     \
          \   elif key=='requiredDeliveryDate':\n            if not re.fullmatch(r'\\\
          d{4}-\\d{2}-\\d{2}',value): raise ValueError('Invalid date')\n         \
          \   date.fromisoformat(value)\n    clear=result['clearFields']\n    if not\
          \ isinstance(clear,list) or len(clear)>len(allowed) or any(not isinstance(f,str)\
          \ or f not in allowed for f in clear):\n        raise ValueError('Invalid\
          \ clear fields')\n    if len(set(clear))!=len(clear) or set(clear)&set(fields):\
          \ raise ValueError('Conflicting field patch')\n    if result['action']!='ORDER'\
          \ and (fields or clear): raise ValueError('Only order action can change\
          \ fields')\n    if not isinstance(result['question'],str) or len(result['question'])>500\
          \ or any(ord(c)<32 or ord(c)==127 for c in result['question']):\n      \
          \  raise ValueError('Invalid question')\n    return {'order_intake_json':json.dumps(result,ensure_ascii=False)}\n\
          \n\ndef planning_context(body, status_code, run_ref):\n    data = trusted(body,\
