        title: 仅展示已复核事实
        code_language: python3
        code: "\"\"\"Pure boundary functions embedded verbatim into Dify Code nodes.\
          \ No I/O.\"\"\"\nimport json\nimport re\nfrom datetime import date\n\nROLES\
          \ = {'ORDER', 'SUPPLY', 'PRODUCTION', 'QUALITY', 'EQUIPMENT', 'AFTERSALES'}\n\
          INTENTS = {'INVENTORY','PRODUCTION','QUALITY','DELIVERY','ORDER','EQUIPMENT','AFTERSALES','KNOWLEDGE','MAINTENANCE','ALARMS','STOCK_MOVEMENT',\n\
          \           'PROCESS_ROUTE','INSPECTION_TRACE','GENERAL','GRAPH_KNOWLEDGE','RECAP',\n\
          \           'ROWS_RESUME','ROWS_FILTER','ROWS_DISPATCH','ROWS_MATERIAL','SET_UNQUALIFIED','SET_FAILED_STATUS','SET_TRIAGE','SET_RESUME'}\n\
          \nINTAKE_LIMITS = {'productQuery':120, 'requiredDeliveryDate':10, 'receiverName':80,\n\
          \                 'receiverPhone':30, 'receiverAddress':500, 'customerName':80,\
          \ 'remark':500}\n\n\ndef order_intake_input(goal, context):\n    if not\
          \ isinstance(goal,str) or not 1<=len(goal.strip())<=2000:\n        raise\
          \ ValueError('Invalid intake text')\n    if not isinstance(context,str)\
          \ or len(context)>16000 or not isinstance(json.loads(context),dict):\n \
          \       raise ValueError('Invalid intake context')\n    return {'goal':goal.strip(),'context':context}\n\
          \n\ndef intake_json(text):\n    if not isinstance(text,str) or len(text)>8000:\
          \ raise ValueError('Invalid intake output')\n    cleaned=text.strip()\n\
          \    if cleaned.startswith('```') and cleaned.endswith('```'):\n       \
          \ cleaned=re.sub(r'^```(?:json)?\\s*','',cleaned,flags=re.I)[:-3].strip()\n\
          \    def unique(pairs):\n        result={}\n        for key,value in pairs:\n\
          \            if key in result: raise ValueError('Duplicate intake field')\n\
          \            result[key]=value\n        return result\n    return json.loads(cleaned,object_pairs_hook=unique)\n\
          \n\ndef order_intake_intent(text):\n    result=intake_json(text)\n    if\
          \ not isinstance(result,dict) or set(result)!={'action'} or result['action']\
          \ not in {'ORDER','QUERY','CANCEL'}:\n        raise ValueError('Invalid\
          \ supervisor intake intent')\n    return result\n\n\ndef order_intake_result(text,\
          \ action=None):\n    result=intake_json(text)\n    if not isinstance(result,dict)\
          \ or set(result)!={'action','fields','clearFields','question'}:\n      \
          \  raise ValueError('Unexpected intake fields')\n    if result['action']\
          \ not in {'ORDER','QUERY','CANCEL'}: raise ValueError('Invalid intake action')\n\
          \    if action is not None and result['action']!=action: raise ValueError('Intake\
          \ action differs from supervisor intent')\n    fields=result['fields'];\
          \ allowed=set(INTAKE_LIMITS)|{'quantity'}\n    if not isinstance(fields,dict)\
          \ or not set(fields)<=allowed: raise ValueError('Invalid field patch')\n\
