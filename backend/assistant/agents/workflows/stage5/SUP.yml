    - id: response_llm
      type: custom
      data:
        desc: ''
        type: llm
        title: 简洁回答（真实流式输出）
        model:
          provider: langgenius/deepseek/deepseek
          name: deepseek-flash
          mode: chat
          completion_params:
            temperature: 0
