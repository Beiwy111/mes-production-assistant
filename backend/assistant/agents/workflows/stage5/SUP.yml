          \ not in ROLES or\n                item.get('authority')!='UNVERIFIED_MODEL_EXPLANATION'\
          \ or\n                item.get('status') not in {'PARTIAL','UNSUPPORTED_BUSINESS_SOURCE'}\
          \ or not item.get('resultRef')):\n            raise ValueError('Invalid\
          \ nonbusiness explanation boundary')\n        text=item.get('text','')\n\
          \        if not isinstance(text,str) or len(text)>6000:\n            raise\
          \ ValueError('Invalid expert explanation')\n        explanations.append(item)\n\
          \        prefix='未接入真实业务数据。' if item['status']=='UNSUPPORTED_BUSINESS_SOURCE'\
          \ else '已读取本角色业务证据；具体数量以上方结构化事实为准。'\n        rows.append(item['agentId']+'补充说明：'+prefix+'以下为模型解释，引用仍需复核，不作为交付依据。\\\
          n'+text)\n    result = {k:data.get(k) for k in ['runRef','workflowProfile','verdict','sourceMode','executedAgents','missing','checkedAt','facts','queryRefs','resultRefs','revalidation']}\n\
          \    result['knowledgeExplanations']=explanations\n    result['expertExplanations']=explanations\n\
          \    result, cut = bounded(result)\n    result['presentation_truncated']\
          \ = cut\n    if cut:\n        rows.append('展示已截断；不能把显示的部分记录当作整单合计。')\n \
          \   encoded = json.dumps(result, ensure_ascii=False)\n    if len(encoded)\
