          \    truncated = False\n    if isinstance(value, list):\n        result\
          \ = []\n        truncated = len(value) > limit\n        for item in value[:limit]:\n\
          \            reduced, cut = bounded(item, limit, depth + 1)\n          \
          \  result.append(reduced); truncated |= cut\n        return result, truncated\n\
          \    if isinstance(value, dict):\n        result = {}\n        for key,\
          \ item in value.items():\n            reduced, cut = bounded(item, limit,\
          \ depth + 1)\n            result[key] = reduced; truncated |= cut\n    \
          \    return result, truncated\n    if isinstance(value, str) and len(value)\
          \ > 1000:\n        return value[:1000] + ' [展示截断]', True\n    return value,\
          \ False\n\n\ndef supervisor_context(body, status_code, run_ref):\n    data\
          \ = trusted(body, status_code, run_ref)\n    if data.get('queryMode') ==\
          \ 'NATURAL':\n        required=data.get('requiredAgents')\n        if data.get('workflowProfile')!='AUTO'\
          \ or not isinstance(required,list) or any(r not in ROLES for r in required):\n\
          \            raise ValueError('Invalid automatic task plan')\n        result={k:data.get(k)\
          \ for k in ['runRef','queryMode','workflowProfile','scope','plan','requiredAgents','dependencies','sourceMode','userQuery']}\n\
          \        return {'context':json.dumps(result,ensure_ascii=False)}\n    profiles={'DELIVERY':['ORDER','SUPPLY','PRODUCTION'],\
