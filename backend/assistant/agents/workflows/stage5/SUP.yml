    - id: planner_input
      type: custom
      data:
        desc: ''
        type: code
        title: 读取问题与连续对话范围
        code_language: python3
        code: "\"\"\"Pure boundary functions embedded verbatim into Dify Code nodes.\
          \ No I/O.\"\"\"\nimport json\nimport re\nfrom datetime import date\n\nROLES\
          \ = {'ORDER', 'SUPPLY', 'PRODUCTION', 'QUALITY', 'EQUIPMENT', 'AFTERSALES'}\n\
          INTENTS = {'INVENTORY','PRODUCTION','QUALITY','DELIVERY','ORDER','EQUIPMENT','AFTERSALES','KNOWLEDGE','MAINTENANCE','ALARMS','STOCK_MOVEMENT'}\n\
          \nINTAKE_LIMITS = {'productQuery':120, 'requiredDeliveryDate':10, 'receiverName':80,\n\
          \                 'receiverPhone':30, 'receiverAddress':500, 'customerName':80,\
          \ 'remark':500}\n\n\ndef order_intake_input(goal, context):\n    if not\
          \ isinstance(goal,str) or not 1<=len(goal.strip())<=2000:\n        raise\
          \ ValueError('Invalid intake text')\n    if not isinstance(context,str)\
          \ or len(context)>16000 or not isinstance(json.loads(context),dict):\n \
          \       raise ValueError('Invalid intake context')\n    return {'goal':goal.strip(),'context':context}\n\
          \n\ndef intake_json(text):\n    if not isinstance(text,str) or len(text)>8000:\
          \ raise ValueError('Invalid intake output')\n    cleaned=text.strip()\n\
          \    if cleaned.startswith('```') and cleaned.endswith('```'):\n       \
          \ cleaned=re.sub(r'^```(?:json)?\\s*','',cleaned,flags=re.I)[:-3].strip()\n\
          \    def unique(pairs):\n        result={}\n        for key,value in pairs:\n\
          \            if key in result: raise ValueError('Duplicate intake field')\n\
          \            result[key]=value\n        return result\n    return json.loads(cleaned,object_pairs_hook=unique)\n\
          \n\ndef order_intake_intent(text):\n    result=intake_json(text)\n    if\
          \ not isinstance(result,dict) or set(result)!={'action'} or result['action']\
          \ not in {'ORDER','QUERY','CANCEL'}:\n        raise ValueError('Invalid\
          \ supervisor intake intent')\n    return result\n\n\ndef order_intake_result(text,\
          \ action=None):\n    result=intake_json(text)\n    if not isinstance(result,dict)\
          \ or set(result)!={'action','fields','clearFields','question'}:\n      \
          \  raise ValueError('Unexpected intake fields')\n    if result['action']\
          \ not in {'ORDER','QUERY','CANCEL'}: raise ValueError('Invalid intake action')\n\
          \    if action is not None and result['action']!=action: raise ValueError('Intake\
          \ action differs from supervisor intent')\n    fields=result['fields'];\
          \ allowed=set(INTAKE_LIMITS)|{'quantity'}\n    if not isinstance(fields,dict)\
          \ or not set(fields)<=allowed: raise ValueError('Invalid field patch')\n\
          \    for key,value in fields.items():\n        if key=='quantity':\n   \
          \         if type(value)!=int or not 1<=value<=2147483647: raise ValueError('Invalid\
          \ quantity')\n        elif not isinstance(value,str) or not value.strip()\
          \ or len(value)>INTAKE_LIMITS[key] or any(ord(c)<32 or ord(c)==127 for c\
          \ in value):\n            raise ValueError('Invalid text field')\n     \
          \   elif key=='requiredDeliveryDate':\n            if not re.fullmatch(r'\\\
          d{4}-\\d{2}-\\d{2}',value): raise ValueError('Invalid date')\n         \
          \   date.fromisoformat(value)\n    clear=result['clearFields']\n    if not\
          \ isinstance(clear,list) or len(clear)>len(allowed) or any(not isinstance(f,str)\
          \ or f not in allowed for f in clear):\n        raise ValueError('Invalid\
          \ clear fields')\n    if len(set(clear))!=len(clear) or set(clear)&set(fields):\
          \ raise ValueError('Conflicting field patch')\n    if result['action']!='ORDER'\
          \ and (fields or clear): raise ValueError('Only order action can change\
          \ fields')\n    if not isinstance(result['question'],str) or len(result['question'])>500\
          \ or any(ord(c)<32 or ord(c)==127 for c in result['question']):\n      \
          \  raise ValueError('Invalid question')\n    return {'order_intake_json':json.dumps(result,ensure_ascii=False)}\n\
          \n\ndef planning_context(body, status_code, run_ref):\n    data = trusted(body,\
          \ status_code, run_ref)\n    if data.get('queryMode') != 'NATURAL':\n  \
          \      return {'context':json.dumps({'queryMode':'LEGACY','workflowProfile':data.get('workflowProfile')})}\n\
          \    result = {k:data.get(k) for k in ['queryMode','userQuery','currentDate','dateTimezone','previousContext','scope','availableTools','capabilities']}\n\
          \    text = json.dumps(result, ensure_ascii=False)\n    if len(text) > 24000:\
          \ raise ValueError('Planning context exceeds budget')\n    return {'context':text}\n\
          \n\ndef planning_body(text, context):\n    if json.loads(context).get('queryMode')\
          \ == 'LEGACY':\n        return {'payload':json.dumps({'action':'LEGACY'})}\n\
          \    if not isinstance(text,str) or len(text)>8000: raise ValueError('Invalid\
          \ planning result')\n    cleaned = text.strip()\n    if cleaned.startswith('```')\
          \ and cleaned.endswith('```'):\n        cleaned = re.sub(r'^```(?:json)?\\\
          s*', '', cleaned, flags=re.I)[:-3].strip()\n    def unique(pairs):\n   \
          \     result={}\n        for key,value in pairs:\n            if key in\
          \ result: raise ValueError('Duplicate plan field')\n            result[key]=value\n\
          \        return result\n    plan=json.loads(cleaned,object_pairs_hook=unique)\n\
          \    fields={'action','intents','orderPk','orderNo','keyword','period','question'}\n\
          \    if not isinstance(plan,dict) or set(plan)!=fields: raise ValueError('Unexpected\
          \ plan fields')\n    if plan['action'] not in {'QUERY','CLARIFY','UNSUPPORTED'}:\
          \ raise ValueError('Invalid plan action')\n    if not isinstance(plan['intents'],list)\
          \ or len(plan['intents'])>len(INTENTS) or any(i not in INTENTS for i in\
          \ plan['intents']): raise ValueError('Invalid intents')\n    if len(set(plan['intents']))!=len(plan['intents']):\
          \ raise ValueError('Duplicate intent')\n    if plan['period'] not in {'CURRENT','TODAY','LAST_7_DAYS','THIS_MONTH'}:\
          \ raise ValueError('Invalid period')\n    for key,maximum in [('orderPk',19),('orderNo',100),('keyword',100)]:\n\
          \        if plan[key] is not None and (not isinstance(plan[key],str) or\
          \ not 1<=len(plan[key])<=maximum): raise ValueError('Invalid scope value')\n\
          \    if plan['orderPk'] is not None and not re.fullmatch(r'[1-9][0-9]{0,18}',plan['orderPk']):\
          \ raise ValueError('Invalid order primary key')\n    if not isinstance(plan['question'],str)\
          \ or len(plan['question'])>500: raise ValueError('Invalid clarification')\n\
          \    return {'payload':json.dumps(plan,ensure_ascii=False)}\n\n\ndef validate_input(run_ref,\
          \ goal):\n    if not isinstance(run_ref, str) or not re.fullmatch(r'[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}',\
          \ run_ref):\n        raise ValueError('Invalid run reference; create a scoped\
          \ preview run first')\n    if not isinstance(goal, str) or not 1 <= len(goal.strip())\
          \ <= 2000:\n        raise ValueError('Goal must contain 1..2000 characters')\n\
          \    return {'run_ref': run_ref, 'goal': goal.strip()}\n\n\ndef trusted(body,\
          \ status_code, run_ref):\n    if status_code != 200 or not isinstance(body,\
          \ str) or len(body) > 2_000_000:\n        raise ValueError('Read-only runtime\
          \ unavailable or request rejected; no delivery conclusion')\n    data =\
          \ json.loads(body)\n    if data.get('runRef') != run_ref or data.get('sourceMode')\
          \ != 'LOCAL_READONLY_PREVIEW':\n        raise ValueError('Runtime identity\
          \ or scope mismatch')\n    return data\n\n\ndef bounded(value, limit=30,\
          \ depth=0):\n    \"\"\"Bound presentation only. Never use a display subset\
          \ to compute totals.\"\"\"\n    if depth > 12:\n        return None, True\n\
          \    truncated = False\n    if isinstance(value, list):\n        result\
          \ = []\n        truncated = len(value) > limit\n        for item in value[:limit]:\n\
          \            reduced, cut = bounded(item, limit, depth + 1)\n          \
          \  result.append(reduced); truncated |= cut\n        return result, truncated\n\
          \    if isinstance(value, dict):\n        result = {}\n        for key,\
          \ item in value.items():\n            reduced, cut = bounded(item, limit,\
          \ depth + 1)\n            result[key] = reduced; truncated |= cut\n    \
          \    return result, truncated\n    if isinstance(value, str) and len(value)\
          \ > 1000:\n        return value[:1000] + ' [展示截断]', True\n    return value,\
          \ False\n\n\ndef supervisor_context(body, status_code, run_ref):\n    data\
          \ = trusted(body, status_code, run_ref)\n    if data.get('queryMode') ==\
          \ 'NATURAL':\n        required=data.get('requiredAgents')\n        if data.get('workflowProfile')!='AUTO'\
          \ or not isinstance(required,list) or any(r not in ROLES for r in required):\n\
          \            raise ValueError('Invalid automatic task plan')\n        result={k:data.get(k)\
          \ for k in ['runRef','queryMode','workflowProfile','scope','plan','requiredAgents','dependencies','sourceMode','userQuery']}\n\
          \        return {'context':json.dumps(result,ensure_ascii=False)}\n    profiles={'DELIVERY':['ORDER','SUPPLY','PRODUCTION'],\
          \ 'ORDER':['ORDER'], 'SUPPLY':['ORDER','SUPPLY'],\n              'PRODUCTION':['ORDER','SUPPLY','PRODUCTION'],\
          \ 'QUALITY':['QUALITY'], 'EQUIPMENT':['EQUIPMENT'],\n              'AFTERSALES':['AFTERSALES'],\
          \ 'FULL_ASSESSMENT':['ORDER','SUPPLY','PRODUCTION','QUALITY','EQUIPMENT','AFTERSALES']}\n\
          \    profile=data.get('workflowProfile','DELIVERY')\n    if profile not\
          \ in profiles or data.get('requiredAgents') != profiles[profile]:\n    \
          \    raise ValueError('Unsupported workflow profile')\n    result = {k:data.get(k)\
          \ for k in ['runRef', 'scope', 'requiredAgents', 'sourceMode']}\n    result['workflowProfile']=profile\n\
          \    result['coverage'] = 'Scoped delivery and live Q1/D1/A1 business evidence;\
          \ empty recorded data is not an unavailable interface. Public knowledge\
          \ is separate.'\n    return {'context':json.dumps(result, ensure_ascii=False)}\n\
          \n\ndef dispatch_waves(context):\n    \"\"\"Compile only the already authorized\
          \ server plan; no model-invented roles/dependencies.\"\"\"\n    plan = json.loads(context)\n\
          \    result = {'mode':'legacy', 'wave1':[], 'wave2':[], 'wave3':[]}\n  \
          \  if plan.get('queryMode') != 'NATURAL':\n        return result\n    required,\
          \ dependencies = plan.get('requiredAgents'), plan.get('dependencies')\n\
          \    if (not isinstance(required, list) or any(not isinstance(r,str) or\
          \ r not in ROLES for r in required)\n            or len(set(required)) !=\
          \ len(required) or not isinstance(dependencies,dict)\n            or set(dependencies)\
          \ != set(required)):\n        raise ValueError('Invalid authorized dispatch\
          \ plan')\n    for role, predecessors in dependencies.items():\n        if\
          \ (not isinstance(predecessors,list) or any(not isinstance(p,str) or p not\
          \ in required or p==role for p in predecessors)\n                or len(set(predecessors))\
          \ != len(predecessors)):\n            raise ValueError('Invalid authorized\
          \ dependencies')\n    completed = set()\n    for wave in ('wave1','wave2','wave3'):\n\
          \        ready = [r for r in required if r not in completed and set(dependencies[r])\
          \ <= completed]\n        result[wave] = ready\n        completed.update(ready)\n\
          \    if completed != set(required):\n        raise ValueError('Cyclic or\
          \ unsupported dependency depth; no partial dispatch')\n    result['mode']\
          \ = 'parallel'\n    return result\n\n\ndef task_context(body, status_code,\
          \ run_ref, role):\n    data = trusted(body, status_code, run_ref)\n    if\
          \ role not in ROLES or data.get('agentId') != role or not data.get('taskId'):\n\
          \        raise ValueError('Task role mismatch')\n    fields = ('runRef','taskId','agentId','status','sourceMode','upstreamResultRefs','queryMode','knowledgeOnly','knowledgeEvidence','upstreamFindings','steps')\n\
          \    result = {k:data.get(k) for k in fields}\n    result['evidence'] =\
          \ []\n    allowed = {\n        'ORDER': {'order','lines','planRefs','workOrderRefs','plannedCoverageQty','unplannedQty','receiptEvidence','metDeadline'},\n\
          \        'SUPPLY': {'materials','readiness','scenarioReadiness','returnCoverage','demandBuckets','allocationScenarioId','purchaseRecords','bomRecords'},\n\
          \        'PRODUCTION': {'workOrders','savedSchedules','scheduleBasis','estimatedShipmentAt','calendarCoverage','recordCompleteness'},\n\
          \        'QUALITY':{'status','complete','warnings','inspections','inspectionItems','nonconformingProducts','inspectionCount','inspectionItemCount','nonconformingRecordCount','batchReleaseStatus','visionEvidence'},\n\
          \        'EQUIPMENT':{'status','complete','warnings','equipment','observedUsage','alarms','maintenanceRecords','equipmentCount','observedUsageCount','alarmCount','maintenanceRecordCount','currentStateBasis','historicalReliabilityStatus','failureProbabilityStatus'},\n\
          \        'AFTERSALES':{'status','complete','warnings','cases','tasks','closures','caseRecordStatus','tracePaths','caseCount','taskCount','closureCount','tracePathLimit','tracePathsComplete','traceStatus','rootCauseStatus'},\n\
          \    }[role]\n    for envelope in data.get('evidence', []):\n        item\
          \ = {k:envelope.get(k) for k in ['queryRef','status','observedAt','missing','warnings','calculationVersion']}\n\
          \        item['data'] = (envelope.get('data',{}) if data.get('queryMode')=='NATURAL'\
          \ else\n                        {k:v for k,v in envelope.get('data',{}).items()\
          \ if k in allowed})\n        if data.get('queryMode') == 'NATURAL' and envelope.get('kind')\
          \ in ('RESOURCE_MATERIAL', 'RESOURCE_CAPACITY'):\n            original =\
          \ envelope.get('data', {})\n            item['kind'] = envelope['kind']\n\
          \            item['data'] = {k: original.get(k) for k in ('status','basis','scope','analysis_at')}\n\
          \            item['data']['record_counts'] = {k:len(original.get(k, []))\
          \ for k in ('rows','coverage','demands')}\n            item['data']['rows']\
          \ = original.get('rows', [])[:12]\n            item['data']['coverage']\
          \ = original.get('coverage', [])[:12]\n            item['data']['presentation_truncated']\
          \ = any(len(original.get(k, [])) > 12 for k in ('rows','coverage'))\n  \
          \          item['data']['source_evidence_location'] = '完整来源及全部计算行保留在服务端查询引用和最终表格；此处仅供专家阅读，不以展示子集推断完整计数。'\n\
          \        result['evidence'].append(item)\n    result, cut = bounded(result)\n\
