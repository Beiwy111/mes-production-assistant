          \ 'INSUFFICIENT_EVIDENCE'}:\n        return {'context': json.dumps({'verdict':\
          \ data.get('verdict'), 'required_reply': data.get('reply', '')}, ensure_ascii=False),\n\
          \                'presentation': 'compact_stream'}\n    context = {'verdict':\
          \ data.get('verdict'), 'domains': [], 'limitations': data.get('missing',\
          \ []),\n               'analyses': data.get('analyses', []), 'equipment_comments':\
          \ []}\n    resource_facts = data.get('facts') or {}\n    if any(k in resource_facts\
