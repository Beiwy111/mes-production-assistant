          \ raise ValueError('Duplicate intent')\n    if plan['period'] not in {'CURRENT','TODAY','LAST_7_DAYS','THIS_MONTH'}:\
          \ raise ValueError('Invalid period')\n    for key,maximum in [('orderPk',19),('orderNo',100),('keyword',100)]:\n\
          \        if plan[key] is not None and (not isinstance(plan[key],str) or\
          \ not 1<=len(plan[key])<=maximum): raise ValueError('Invalid scope value')\n\
          \    if plan['orderPk'] is not None and not re.fullmatch(r'[1-9][0-9]{0,18}',plan['orderPk']):\
