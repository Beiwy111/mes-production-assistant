          \                    reply+='\\n\\n设备分析建议（需结合证据核验）：\\n'+str(item['text'])[:1800]\n\
          \        elif data['verdict'] in {'EVIDENCE_READY','INSUFFICIENT_EVIDENCE'}:\n\
          \            # Explicitly separate model interpretation/public literature\
          \ from server-computed facts.\n            explanations=[]\n           \
          \ for item in data.get('expertExplanations',[]):\n                if item.get('agentId')\
