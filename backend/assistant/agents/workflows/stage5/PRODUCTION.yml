          \ <= 2000:\n        raise ValueError('Goal must contain 1..2000 characters')\n\
          \    return {'run_ref': run_ref, 'goal': goal.strip()}\n\n\ndef trusted(body,\
          \ status_code, run_ref):\n    if status_code != 200 or not isinstance(body,\
